pluginManagement {
    repositories {
        // Google first: AGP is only hosted there, and resolving it through the plugin portal goes
        // via Maven Central, which rate-limits CI hosts such as JitPack (HTTP 429).
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Some AdMob mediation adapters resolve their network SDK from the network's own repo.
        // Uncomment the ones you use alongside the matching adapter in app/build.gradle.
        // maven { url = 'https://artifact.bytedance.com/repository/pangle' }
        // maven { url = 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea' }
    }
}
rootProject.name = "Unusual Network"
include ':app'
include ':uan'
