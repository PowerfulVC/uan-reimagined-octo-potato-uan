plugins {
    id 'com.android.application'
}

android {
    namespace = "unusual.ad.network.uan"
    compileSdk = 37

    defaultConfig {
        applicationId = "unusual.ad.network.uan"
        minSdk = 24
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"

        // Required by the uan library: your AdMob app ID (this is Google's public test ID).
        manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation project(path: ':uan')

    // AdMob mediation: add the adapter for every network enabled in your AdMob mediation groups.
    // Adapters pull in their network SDK; the uan library needs no code changes per network.
    // implementation 'com.google.ads.mediation:applovin:13.6.4.2'
    // implementation 'com.google.ads.mediation:facebook:6.22.0.1'
    // implementation 'com.google.ads.mediation:unity:4.21.0.0'
    // implementation 'com.google.ads.mediation:ironsource:9.6.1.0'
    // implementation 'com.google.ads.mediation:mintegral:17.1.81.1'
    // implementation 'com.google.ads.mediation:pangle:8.3.0.4.0'
    // implementation 'com.google.ads.mediation:vungle:7.7.8.1'
    // implementation 'com.google.ads.mediation:inmobi:11.5.0.1'
    // implementation 'com.google.ads.mediation:chartboost:9.14.1.0'
}
