plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'uan.mod'
    compileSdk = 37

    defaultConfig {
        // Google Mobile Ads SDK 25.5.0+ requires API 24.
        minSdk = 24

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

// JitPack runs publishToMavenLocal with -Pgroup / -Pversion set to the GitHub coordinates.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'uan'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    // Types from these appear in the public API (AppCompatActivity, RecyclerView.ViewHolder, Job).
    api 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    api 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'

    // Exposed as api so host apps can use AdMob types (AdValue, ResponseInfo, mediation extras)
    // and add AdMob mediation adapters (com.google.ads.mediation:*) on top of the same SDK.
    api 'com.google.android.gms:play-services-ads:25.5.0'
    api 'com.google.android.ump:user-messaging-platform:4.0.0'

    testImplementation 'junit:junit:4.13.2'
}
